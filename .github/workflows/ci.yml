name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulnuser
          POSTGRES_PASSWORD: vulnpass
          POSTGRES_DB: vulntest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vulnuser -d vulntest"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vulnuser:vulnpass@localhost:5432/vulntest
      DATABASE_URL: postgresql://vulnuser:vulnpass@localhost:5432/vulntest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check

  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Ingest sample scans through the real stack (incl. background worker)
        run: |
          curl -fsS -F format=nmap -F async_mode=true -F file=@samples/nmap_scan.xml localhost:8000/ingest/upload
          curl -fsS -F format=nessus -F file=@samples/nessus_scan.nessus localhost:8000/ingest/upload
          sleep 3
          curl -fsS localhost:8000/reports > reports.json
          cat reports.json
          grep -q '"status":"completed"' reports.json
          curl -fsS "localhost:8000/chains?min_risk=9" > chains.json
          cat chains.json
          grep -q foothold-to-privesc chains.json
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
