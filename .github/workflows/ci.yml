name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint + tests (Python ${{ matrix.python }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  test-postgres-redis:
    name: Tests (PostgreSQL + real Redis/RQ) and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulnuser
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vulntest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vulnuser -d vulntest"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vulnuser:ci-only-password@localhost:5432/vulntest
      DATABASE_URL: postgresql://vulnuser:ci-only-password@localhost:5432/vulntest
      TEST_REDIS_URL: redis://localhost:6379/5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Migrations apply, match the models, and round-trip
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade 0001
          alembic upgrade head
          alembic check

  evaluation:
    name: Attack-path evaluation (ground truth + independent oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # exits non-zero if any reported path is invalid, any evidence class is overstated, or the oracle finds a false positive
      - run: python -m evaluation.run --out evaluation/results/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/results/ci.json

  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [test]
    env:
      API_KEY: ci-api-key-0123456789abcdef
      POSTGRES_PASSWORD: ci-pg-password-0123456789
      INTEL_DEMO_DATA: "true"
      INTEL_LIVE_SYNC: "false"   # the smoke test must not depend on external feeds
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Authentication is enforced
        run: test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/assets)" = "401"
      - name: Ingest through the real worker, analyse, and check the attack path
        run: |
          H="X-API-Key: $API_KEY"
          curl -fsS -H "$H" -H 'content-type: application/json' -d @samples/demo_network.json "localhost:8000/ingest?async_mode=true"
          sleep 5
          curl -fsS -H "$H" localhost:8000/reports/1 | tee report.json
          grep -q '"status":"completed"' report.json
          DB=$(curl -fsS -H "$H" localhost:8000/assets | python3 -c "import sys,json; print(next(a['id'] for a in json.load(sys.stdin) if a['hostname'].startswith('db01')))")
          curl -fsS -X PATCH -H "$H" -H 'content-type: application/json' -d '{"criticality":5}' "localhost:8000/assets/$DB"
          curl -fsS -X POST -H "$H" -H 'content-type: application/json' -d '{}' localhost:8000/analysis/runs
          sleep 5
          curl -fsS -H "$H" localhost:8000/attack-paths | tee paths.json
          python3 - <<'PY'
          import json
          d = json.load(open("paths.json"))
          assert d["total"] == 1, d["total"]
          p = d["items"][0]
          assert p["evidence_status"] == "partially_inferred" and not p["is_confirmed_exploit_chain"]
          assert "jump01" not in json.dumps(p), "an unreachable same-subnet host must not appear on a path"
          PY
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
